name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  LLVM_MINGW: llvm-mingw-20261117-ucrt-ubuntu-22.04-x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libncurses-dev
          curl -sL https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/$LLVM_MINGW.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          for preset in default windows-x64 windows-arm64; do
            cmake --preset $preset && cmake --build --preset $preset
          done
          mkdir dist
          cp build/windows-x64/hexedit.exe   dist/hexedit-windows-x64.exe
          cp build/windows-arm64/hexedit.exe dist/hexedit-windows-arm64.exe
          cp build/default/hexedit           dist/hexedit-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: hexedit
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hexedit
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
